eureka:
    client:
        fetch-registry: true
        register-with-eureka: true
        service-url:
            defaultZone: http://localhost:8686/eureka/
spring:
    application:
        name: order-service-eureka
    datasource:
        driver-class-name: org.postgresql.Driver
        password: 123456$
        url: jdbc:postgresql://localhost:5432/logistic
        username: postgres
    jpa:
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                format_sql: true
        show-sql: true
    kafka:
      # đây là cổng chạy của kafka trên docker
      bootstrap-servers: localhost:9092
      producer:
        # Định dạng của key
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        # Chuyển thành Json
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        # tính tin cậy
        acks: all
        # số lần thử lại tối đa
        retries: 3
        properties:
#          spring.json.trusted.packages: "*"
#          spring.json.use.type.headers: false
#          spring.json.add.type.headers: false
          spring.json.type.mapping: OrderCreate:re.orderservice.dto.request.OrderCreateDto

