eureka:
    client:
        fetch-registry: true
        register-with-eureka: true
        service-url:
            defaultZone: http://localhost:8686/eureka/
spring:
    application:
        name: order-service-eureka
    datasource:
        driver-class-name: org.postgresql.Driver
        password: 123456$
        url: jdbc:postgresql://localhost:5432/logistic
        username: postgres
    jpa:
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                format_sql: true
        show-sql: true
